services:
  api:
    image: ghcr.io/fuad-bassam/vehicle-explorer-api:latest
    build:
      context: ./backend
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__Redis: redis:6379
    ports:
      - "${API_PORT:-5080}:8080"
    depends_on:
      - redis
    restart: unless-stopped

  web:
    image: ghcr.io/fuad-bassam/vehicle-explorer-web:latest
    build:
      context: ./frontend
    environment:
      API_BASE_URL: http://api:8080/
    ports:
      - "${WEB_PORT:-3000}:3000"
    depends_on:
      - api
    restart: unless-stopped

  redis:
    image: redis:8-alpine
    restart: unless-stopped
