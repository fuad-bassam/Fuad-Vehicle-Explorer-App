services:
  api:
    image: vehicle-explorer-api:latest
    build:
      context: ./backend
    environment:
      ASPNETCORE_ENVIRONMENT: Production
    ports:
      - "${API_PORT:-5080}:8080"
    restart: unless-stopped

  web:
    image: vehicle-explorer-web:latest
    build:
      context: ./frontend
    environment:
      API_BASE_URL: http://api:8080/
    ports:
      - "${WEB_PORT:-3000}:3000"
    depends_on:
      - api
    restart: unless-stopped
