name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push images
        run: |
          docker compose build api web
          docker compose push api web

      - name: Deploy to EC2
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$EC2_SSH_KEY" | tr -d '\r\n ' | base64 -d > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$EC2_HOST" >> ~/.ssh/known_hosts
          site="$(echo "$EC2_HOST" | tr '.' '-').sslip.io"
          scp -i ~/.ssh/deploy_key docker-compose.yml docker-compose.https.yml Caddyfile "ec2-user@$EC2_HOST:~/vehicle-explorer/"
          ssh -i ~/.ssh/deploy_key "ec2-user@$EC2_HOST" "cd ~/vehicle-explorer && printf 'WEB_PORT=3000\nSITE_ADDRESS=$site\n' > .env && docker compose -f docker-compose.yml -f docker-compose.https.yml pull && docker compose -f docker-compose.yml -f docker-compose.https.yml up -d --no-build && docker image prune -f"
